<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.45" stop-color="#071a38"/>
      <stop offset="1" stop-color="#0b1630"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="1" stop-color="#03060d"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#dbeafe" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7b7b"/>
      <stop offset="0.45" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02040a" stop-opacity="0.75"/>
      <stop offset="0.25" stop-color="#02040a" stop-opacity="0.25"/>
      <stop offset="0.50" stop-color="#02040a" stop-opacity="0.48"/>
      <stop offset="0.72" stop-color="#02040a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#02040a" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect width="1200" height="420" rx="18" fill="url(#sky)"/>
  <ellipse cx="930" cy="72" rx="150" ry="70" fill="#234a8b" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="680" cy="105" rx="210" ry="78" fill="#172554" opacity="0.28" filter="url(#soft)"/>

  <!-- stars -->
  <g fill="#eef6ff">
    <circle cx="58" cy="34" r="1.5"/><circle cx="93" cy="78" r="1"/><circle cx="132" cy="49" r="1.2"/><circle cx="185" cy="31" r="1"/>
    <circle cx="235" cy="84" r="1.4"/><circle cx="282" cy="52" r="1"/><circle cx="335" cy="22" r="1.2"/><circle cx="387" cy="72" r="1.4"/>
    <circle cx="431" cy="39" r="1"/><circle cx="482" cy="91" r="1.3"/><circle cx="526" cy="26" r="1"/><circle cx="574" cy="61" r="1.4"/>
    <circle cx="623" cy="35" r="1"/><circle cx="668" cy="82" r="1.2"/><circle cx="717" cy="48" r="1.4"/><circle cx="762" cy="24" r="1"/>
    <circle cx="812" cy="89" r="1.2"/><circle cx="858" cy="53" r="1"/><circle cx="905" cy="28" r="1.3"/><circle cx="954" cy="98" r="1"/>
    <circle cx="1005" cy="42" r="1.5"/><circle cx="1054" cy="76" r="1"/><circle cx="1100" cy="36" r="1.2"/><circle cx="1140" cy="86" r="1.3"/>
    <circle cx="150" cy="116" r="1"/><circle cx="248" cy="137" r="1.2"/><circle cx="354" cy="122" r="1"/><circle cx="748" cy="128" r="1.2"/>
    <circle cx="840" cy="144" r="1"/><circle cx="1094" cy="132" r="1.4"/>
  </g>
  <g fill="#93c5fd" opacity="0.8"><circle cx="207" cy="62" r="1.8"/><circle cx="604" cy="103" r="1.7"/><circle cx="792" cy="68" r="1.6"/><circle cx="1121" cy="58" r="1.7"/></g>

  <!-- moon -->
  <circle cx="1050" cy="72" r="62" fill="url(#moonGlow)" opacity="0.75"/>
  <circle cx="1050" cy="72" r="31" fill="#eaf2ff"/>
  <circle cx="1039" cy="61" r="6" fill="#cbd5e1" opacity="0.55"/>
  <circle cx="1060" cy="80" r="8" fill="#cbd5e1" opacity="0.42"/>
  <circle cx="1047" cy="88" r="4" fill="#cbd5e1" opacity="0.4"/>

  <!-- clouds -->
  <g fill="#253b66" opacity="0.65">
    <path d="M0 138 C85 100 130 119 179 145 C237 107 311 116 350 151 C285 166 221 168 152 162 C91 158 44 153 0 162Z"/>
    <path d="M848 145 C898 115 952 119 989 146 C1030 111 1117 109 1200 151 L1200 180 C1118 170 1039 170 968 175 C919 179 881 168 848 145Z"/>
  </g>

  <!-- distant mountains/city -->
  <path d="M0 277 L95 230 L160 254 L235 210 L304 250 L390 195 L475 254 L565 220 L650 258 L741 210 L825 252 L908 198 L995 244 L1080 216 L1200 266 L1200 329 L0 329Z" fill="#081122"/>
  <path d="M0 295 L112 274 L188 282 L262 266 L346 281 L430 261 L510 279 L600 258 L690 281 L772 264 L862 278 L951 258 L1041 280 L1120 268 L1200 282 L1200 332 L0 332Z" fill="#0b1830"/>
  <g fill="#f6c56f" opacity="0.8">
    <rect x="410" y="282" width="3" height="3"/><rect x="428" y="276" width="4" height="3"/><rect x="450" y="285" width="3" height="3"/>
    <rect x="476" y="274" width="3" height="3"/><rect x="505" y="282" width="4" height="3"/><rect x="535" y="271" width="3" height="3"/>
    <rect x="565" y="283" width="4" height="3"/><rect x="598" y="272" width="3" height="3"/><rect x="625" y="284" width="4" height="3"/>
    <rect x="655" y="275" width="3" height="3"/><rect x="690" y="283" width="4" height="3"/><rect x="722" y="270" width="3" height="3"/>
    <rect x="755" y="281" width="4" height="3"/><rect x="792" y="274" width="3" height="3"/><rect x="830" y="283" width="4" height="3"/>
    <rect x="873" y="271" width="3" height="3"/><rect x="904" y="281" width="4" height="3"/><rect x="935" y="274" width="3" height="3"/>
  </g>

  <!-- torii silhouette -->
  <g transform="translate(930 212)" fill="#54151c">
    <rect x="0" y="14" width="118" height="9" rx="2"/>
    <rect x="12" y="4" width="94" height="7" rx="2"/>
    <rect x="24" y="20" width="11" height="74"/><rect x="82" y="20" width="11" height="74"/>
    <rect x="18" y="39" width="82" height="7"/>
  </g>

  <!-- water -->
  <rect x="0" y="329" width="1200" height="91" fill="url(#water)"/>
  <g stroke="#f59e0b" stroke-linecap="round" opacity="0.25">
    <path d="M407 344h20M441 351h14M468 340h23M502 357h17M538 345h19M570 360h28M616 348h16M650 356h23M686 343h17M724 360h21M764 349h20M802 356h15M842 346h26M884 357h18"/>
  </g>

  <!-- red maple foliage -->
  <g fill="#991b1b" opacity="0.9">
    <path d="M0 0h250v18c-31 4-55 13-74 30-27-19-54-27-85-22C62 10 36 14 0 36Z"/>
    <circle cx="95" cy="28" r="18"/><circle cx="134" cy="24" r="16"/><circle cx="179" cy="35" r="20"/>
  </g>
  <g fill="#ef4444" opacity="0.75"><circle cx="177" cy="54" r="3"/><circle cx="230" cy="76" r="3"/><circle cx="1008" cy="158" r="3"/><circle cx="1142" cy="201" r="3"/><circle cx="920" cy="119" r="2.5"/></g>

  <!-- seated anime-inspired developer silhouette, tanned skin -->
  <g transform="translate(92 213)">
    <rect x="0" y="116" width="250" height="14" rx="4" fill="#151c29"/>
    <circle cx="101" cy="43" r="28" fill="#b97855"/>
    <path d="M73 40 C72 9 123 3 133 31 C126 24 116 22 107 23 C99 14 84 20 79 29 C73 32 72 37 73 40Z" fill="#0a0d14"/>
    <path d="M64 64 C82 49 118 49 137 67 L161 116 H47Z" fill="#10151f"/>
    <path d="M72 68 C86 58 113 58 127 69 L140 99 H58Z" fill="#161d2a"/>
    <path d="M87 62 L99 77 L112 62" fill="none" stroke="#7f1d1d" stroke-width="5"/>
    <path d="M126 79 C151 83 169 95 183 109" fill="none" stroke="#b97855" stroke-width="11" stroke-linecap="round"/>
    <path d="M61 112 C90 105 119 103 151 112" fill="none" stroke="#0b0e14" stroke-width="20" stroke-linecap="round"/>
    <path d="M117 112 C141 103 174 103 207 112" fill="none" stroke="#0b0e14" stroke-width="18" stroke-linecap="round"/>
    <path d="M183 109 C198 104 211 102 225 105" fill="none" stroke="#b97855" stroke-width="9" stroke-linecap="round"/>
    <text x="88" y="94" font-family="Arial, sans-serif" font-size="23" fill="#b91c1c" font-weight="700">夢</text>
    <circle cx="217" cy="112" r="13" fill="#05070c"/><path d="M206 101 l11 -8 l10 9" fill="#05070c"/>
  </g>

  <!-- cute monsters -->
  <g transform="translate(935 315)">
    <!-- green slime -->
    <path d="M0 45 C3 17 19 4 37 15 C44 1 50 1 54 14 C71 12 81 28 78 45 C74 61 7 61 0 45Z" fill="#7ed957" stroke="#b7f58d" stroke-width="2"/>
    <circle cx="24" cy="37" r="3" fill="#172b19"/><circle cx="52" cy="37" r="3" fill="#172b19"/><path d="M31 45 Q38 51 46 45" fill="none" stroke="#172b19" stroke-width="2"/>
    <circle cx="17" cy="43" r="4" fill="#ffb4c7" opacity="0.75"/><circle cx="59" cy="43" r="4" fill="#ffb4c7" opacity="0.75"/>
    <!-- pink bean -->
    <g transform="translate(92 2)"><ellipse cx="36" cy="39" rx="31" ry="28" fill="#f2a5bc" stroke="#ffd0dd" stroke-width="2"/><path d="M13 21 L6 8 L22 15M59 21 L67 8 L51 15" fill="#8c4b8f"/><circle cx="25" cy="37" r="3" fill="#2c1831"/><circle cx="47" cy="37" r="3" fill="#2c1831"/><path d="M29 46 Q36 50 43 46" fill="none" stroke="#2c1831" stroke-width="2"/><circle cx="17" cy="44" r="4" fill="#ff799e"/><circle cx="55" cy="44" r="4" fill="#ff799e"/></g>
    <!-- white yeti -->
    <g transform="translate(176 -9)"><path d="M8 54 C8 18 27 2 50 10 C69 1 91 18 91 50 C91 69 77 76 50 76 C21 76 8 68 8 54Z" fill="#f3f5f7" stroke="#dbe3ea" stroke-width="3"/><circle cx="35" cy="44" r="3" fill="#1f2937"/><circle cx="62" cy="44" r="3" fill="#1f2937"/><path d="M40 54 Q49 60 58 54" fill="none" stroke="#1f2937" stroke-width="2"/><circle cx="27" cy="52" r="5" fill="#f9a8b8" opacity="0.7"/><circle cx="70" cy="52" r="5" fill="#f9a8b8" opacity="0.7"/><ellipse cx="15" cy="37" rx="11" ry="16" fill="#f3f5f7" transform="rotate(-28 15 37)"/></g>
  </g>

  <!-- readable overlay -->
  <rect width="1200" height="420" rx="18" fill="url(#shade)"/>

  <!-- title/content -->
  <g text-anchor="middle">
    <text x="600" y="84" font-family="Georgia, Times New Roman, serif" font-size="45" font-weight="700" letter-spacing="5" fill="#f8fafc">SANJAI <tspan fill="url(#titleRed)" filter="url(#glow)">RATNARAJAH</tspan></text>
    <text x="600" y="116" font-family="Arial, sans-serif" font-size="13" letter-spacing="5" fill="#e5e7eb">FULL-STACK DEVELOPMENT  •  SOFTWARE ENGINEERING  •  AI</text>
    <rect x="575" y="132" width="50" height="2" rx="1" fill="#ef4444"/>
    <text x="600" y="158" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Building reliable software beyond the prototype stage.</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="385" y="184" width="4" height="22" rx="2" fill="#ef4444"/>
    <text x="400" y="201" font-size="17" font-weight="700" fill="#f8fafc">About</text>
    <text x="400" y="226" font-size="13.5" fill="#dbe4ef">Full-stack developer focused on backend architecture, distributed</text>
    <text x="400" y="246" font-size="13.5" fill="#dbe4ef">systems, AI integration, and production-style engineering.</text>
    <text x="400" y="275" font-size="13.5" fill="#cbd5e1">I like taking ideas past the demo stage: authentication, databases,</text>
    <text x="400" y="295" font-size="13.5" fill="#cbd5e1">caching, messaging, testing, CI/CD, deployment, reliability, and</text>
    <text x="400" y="315" font-size="13.5" fill="#cbd5e1">the design decisions that make software hold up outside a happy-path prototype.</text>
  </g>

  <text x="1010" y="182" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#d8dee9" opacity="0.8" text-anchor="middle">Better software.</text>
  <text x="1010" y="206" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#d8dee9" opacity="0.8" text-anchor="middle">Brighter tomorrows.</text>

  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#334155" stroke-width="2" opacity="0.75"/>
</svg>